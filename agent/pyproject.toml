[project]
name = "digital-eric-agent"
version = "0.1.0"
description = "Digital Eric - portfolio AI agent backend (FastAPI Cloud)"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.115",
    "google-genai>=1.0",
    "httpx>=0.27",
]

[dependency-groups]
dev = ["pytest>=8", "anyio>=4"]

[tool.setuptools]
packages = ["app"]

[tool.pytest.ini_options]
pythonpath = [".."]
testpaths = ["tests"]
